name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Bygg och testa
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Release
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration $BUILD_CONFIGURATION

      - name: Test
        run: dotnet test --no-build --configuration $BUILD_CONFIGURATION

      - name: Vem och vad startade detta?
        env:
          STARTAD_AV: ${{ github.actor }}
          HANDELSE: ${{ github.event_name }}
          GREN: ${{ github.ref_name }}
        run: |
          echo "Startad av $STARTAD_AV - händelse: $HANDELSE - gren: $GREN" | tee -a $GITHUB_STEP_SUMMARY